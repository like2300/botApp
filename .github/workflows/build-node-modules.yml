name: build-node-modules
# Construit node_modules (Linux x64, Node 24) pour AlwaysData mutualise,
# ou npm se fait tuer (quota RAM du conteneur).
# Declenchement manuel : onglet Actions > build-node-modules > Run workflow.
# Puis telechargez l'artefact "node_modules-linux" et envoyez-le dans ~/botApp.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: tar -czf node_modules-linux.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node_modules-linux
          path: node_modules-linux.tar.gz
          retention-days: 7
